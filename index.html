<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kalkulačka povrchu válce</title>
    <script>
      // Apply the theme before the first paint to avoid a flash of the wrong colors
      (function () {
        let theme = null;
        try {
          theme = localStorage.getItem("theme");
        } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <nav class="toolbar">
      <div class="language-switch" role="group" aria-label="Language">
        <button type="button" class="language-button" data-lang="cs">CS</button>
        <button type="button" class="language-button" data-lang="en">EN</button>
        <button type="button" class="language-button" data-lang="de">DE</button>
      </div>

      <button type="button" id="theme-toggle" class="theme-toggle">
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4.5" />
          <path
            d="M12 1.5v2.5M12 20v2.5M1.5 12H4M20 12h2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"
          />
        </svg>
      </button>
    </nav>

    <header class="site-header">
      <h1 data-i18n="title">Kalkulačka povrchu válce</h1>
      <p class="subtitle" data-i18n="subtitle">Povrch válce bez podstav a s podstavami</p>
    </header>

    <main class="calculator">
      <figure class="illustration">
        <img src="Pictures/cylinder.png" data-i18n-alt="imageAlt" alt="Válec s výškou h a poloměrem r" />
        <figcaption>
          <span>π · d · h</span>
          <span>π · d · h + 2 · π · r²</span>
        </figcaption>
      </figure>

      <form id="calculator-form" class="calculator-form" novalidate>
        <div class="field">
          <label for="outer-diameter"><span data-i18n="diameter">Vnější průměr</span> <span class="hint">d</span></label>
          <input
            type="number"
            id="outer-diameter"
            name="outer-diameter"
            inputmode="decimal"
            min="0"
            step="any"
            data-i18n-placeholder="diameterPlaceholder"
            placeholder="např. 10"
          />
        </div>

        <div class="field">
          <label for="length-of-the-cylinder"><span data-i18n="length">Délka válce</span> <span class="hint">h</span></label>
          <input
            type="number"
            id="length-of-the-cylinder"
            name="length-of-the-cylinder"
            inputmode="decimal"
            min="0"
            step="any"
            data-i18n-placeholder="lengthPlaceholder"
            placeholder="např. 20"
          />
        </div>

        <div class="field">
          <label for="unit-select" data-i18n="unit">Jednotka</label>
          <select id="unit-select" name="unit">
            <option value="mm">mm</option>
            <option value="cm">cm</option>
            <option value="m">m</option>
            <option value="km">km</option>
          </select>
        </div>

        <button id="submit-button" type="submit" data-i18n="calculate">Spočítat</button>
      </form>

      <section id="output-box" class="results" aria-live="polite">
        <div class="result">
          <span class="result-label" data-i18n="withoutBases">Bez podstav (plášť)</span>
          <span class="result-value" id="lateral-surface">–</span>
        </div>
        <div class="result">
          <span class="result-label" data-i18n="withBases">S podstavami</span>
          <span class="result-value" id="total-surface">–</span>
        </div>
        <p class="error" id="error-message" data-i18n="error" hidden></p>
      </section>
    </main>

    <script src="main.js"></script>
  </body>
</html>

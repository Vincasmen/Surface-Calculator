<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Surface Calculator</title>
    <link rel="stylesheet" href="main.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800&display=swap"
    />
  </head>
  <body>
    <header>
      <div class="main-page-header">
        <h1 class="page-header">Surface calculator</h1>
      </div>
    </header>
    <hero>
      <img src="Pictures/cylinder.png" alt="cylinder" />
    </hero>

    <!----FORMS--->

    <div class="input-field">
      <form id="form-PI">
        <label for="PI">π</label>
        <input
          type="number"
          id="PI"
          name="π"
          placeholder="3,141592654"
          readonly
        />
      </form>
      <form id="form-outer-diameter">
        <label for="outer-diameter">Outer diameter</label>
        <input
          type="number"
          id="outer-diameter"
          name="Outer diameter"
          placeholder="Outer diameter"
        />
      </form>
      <form id="form-length-of-the-cylinder">
        <label for="length-of-the-cylinder">Length of the cylinder</label>
        <input
          type="number"
          id="length-of-the-cylinder"
          name="Cylinder length"
          placeholder="Cylinder length"
        />
      </form>
    </div>
    <div>
      <div id="dropdown-section">
        <div id="unit-dropdown">
          <button id="dropdown-btn">Select a unit</button>
          <div id="dropdown-options">
            <a href="#">mm</a>
            <a href="#">cm</a>
            <a href="#">m</a>
            <a href="#">km</a>
          </div>
        </div>
      </div>
    </div>
    <div id="submit-output-section">
      <button id="submit-button" type="button">Calculate!</button>
      <p id="output-box"></p>
    </div>
    <footer></footer>
  </body>
  <script src="main.js"></script>
</html>
